[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hiai"
version = "0.1.0"
description = "HIAI - Local AI Terminal Coding Agent powered by OpenRouter"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "HIAI Contributors" }
]
keywords = ["ai", "terminal", "coding-agent", "openrouter", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Code Generators",
]

[project.scripts]
hiai = "hiai.cli:main"

[project.urls]
Homepage = "https://github.com/hiai-ai/hiai"
Repository = "https://github.com/hiai-ai/hiai"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
